<header class="header">

    <!-- LOGO -->
    <div class="logo" (click)="irParaInicio()">
        <img src="/logo-dream.png" alt="DREAM">
    </div>

    <!-- PESQUISA -->
    <div class="search">

        <i class="bi bi-search"></i>

        <input
            type="text"
            placeholder="Pesquise qualquer título..."
        >

        <button>Navegar</button>

    </div>

    <!-- MENU -->
    <div class="menu">

        <i class="bi bi-gear"></i>

        <i class="bi bi-list"></i>

        <i class="bi bi-bell"></i>

        <!-- AVATAR -->
        <div
            class="perfil"
            (click)="toggleUserMenu($event)"
        >
            D
        </div>

    </div>

</header>


<!-- FUNDO PARA FECHAR O MENU -->
<div
    class="menu-overlay"
    *ngIf="userMenuOpen"
    (click)="fecharUserMenu()"
></div>


<!-- MENU DO USUÁRIO -->
<app-user-menu
    *ngIf="userMenuOpen"
    (click)="$event.stopPropagation()"
    (fecharMenu)="fecharUserMenu()"
></app-user-menu>
