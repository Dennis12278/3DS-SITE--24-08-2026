<div class="user-menu">

    <!-- CABEÇALHO DO USUÁRIO -->
    <div class="user-header">

        <div class="user-avatar">
            U
        </div>

        <div class="user-info">
            <h3>Usuário</h3>
            <span>@usuario</span>
        </div>

    </div>


    <!-- OPÇÕES -->
    <div class="menu-options">

        <!-- MEU PERFIL -->
        <button
            class="user-option"
            (click)="irParaMeuPerfil()"
        >
            <i class="bi bi-person"></i>
            <span>Meu Perfil</span>
        </button>


        <!-- PERFIL PÚBLICO -->
        <button
            class="user-option"
            (click)="fechar()"
        >
            <i class="bi bi-globe"></i>
            <span>Perfil Público</span>
        </button>


        <!-- TÍTULOS SEGUIDOS -->
        <button
            class="user-option"
            (click)="fechar()"
        >
            <i class="bi bi-bookmark"></i>
            <span>Títulos Seguidos</span>
        </button>


        <!-- HISTÓRICO -->
        <button
            class="user-option"
            (click)="fechar()"
        >
            <i class="bi bi-clock-history"></i>
            <span>Histórico de Leitura</span>
        </button>


        <!-- CONTEÚDOS BAIXADOS -->
        <button
            class="user-option"
            (click)="fechar()"
        >
            <i class="bi bi-download"></i>
            <span>Conteúdos Baixados</span>
        </button>


        <!-- COLEÇÕES -->
        <button
            class="user-option"
            (click)="fechar()"
        >
            <i class="bi bi-collection"></i>
            <span>Coleções</span>
        </button>


        <!-- NOTIFICAÇÕES -->
        <button
            class="user-option"
            (click)="fechar()"
        >
            <i class="bi bi-bell"></i>
            <span>Notificações</span>
        </button>


        <!-- MINHAS PUBLICAÇÕES -->
        <button
            class="user-option"
            (click)="fechar()"
        >
            <i class="bi bi-file-earmark-text"></i>
            <span>Minhas Publicações</span>
        </button>


        <!-- CONFIGURAÇÕES -->
        <button
            class="user-option"
            (click)="fechar()"
        >
            <i class="bi bi-gear"></i>
            <span>Configurações</span>
        </button>

    </div>


    <!-- DIVISÓRIA -->
    <div class="menu-divider"></div>


    <!-- SAIR -->
    <button
        class="user-option logout"
        (click)="fechar()"
    >
        <i class="bi bi-box-arrow-right"></i>
        <span>Sair</span>
    </button>

</div>
